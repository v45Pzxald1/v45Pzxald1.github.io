<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>数据旅行家 · 莲花山公园</title>
<style>
:root{--ink:#203e37;--green:#23654e;--deep:#194c3a;--lime:#dcec97;--paper:#faf8f0;--muted:#66776d;--line:#dce3d5;--orange:#eaa15b;--blue:#e0edf0;--shadow:0 12px 36px #2948380c}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-size:17px;line-height:1.65}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}button:disabled{cursor:not-allowed;opacity:.46}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #c77b19;outline-offset:4px}button{touch-action:manipulation}h1,h2,h3,p{margin:0}h1{font-size:clamp(35px,4.5vw,64px);line-height:1.2;letter-spacing:-2px}h2{font-size:clamp(27px,3vw,38px);line-height:1.35}h3{font-size:21px}a{color:var(--green)}header{border-bottom:1px solid var(--line);background:#faf8f0ed;position:sticky;top:0;z-index:8;backdrop-filter:blur(10px)}.bar{max-width:1280px;margin:auto;padding:15px 30px;display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;margin-right:auto;white-space:nowrap}.mark{width:37px;height:37px;background:var(--green);color:var(--lime);border-radius:50% 50% 50% 9px;display:grid;place-items:center;font-size:23px}.pill{border:1px solid var(--line);background:#fff9;border-radius:100px;padding:8px 16px;font-size:14px;font-weight:650}.pill:hover{border-color:var(--green);background:#fff}.count{background:var(--green);color:white;padding:1px 7px;border-radius:12px;margin-left:5px;font-size:12px}.wrap{max-width:1280px;margin:auto;padding:34px 30px 45px}.eyebrow{color:var(--green);font-size:13px;letter-spacing:2px;font-weight:800;text-transform:uppercase;margin-bottom:16px}.muted{color:var(--muted)}.small{font-size:13px}.hero{display:grid;grid-template-columns:1fr 1.17fr;gap:48px;align-items:center;padding:28px 0 40px}.hero p{margin:23px 0;color:var(--muted);max-width:490px;font-size:18px;line-height:1.9}.hero h1 em{font-style:normal;color:var(--green)}.tags{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.tag{padding:5px 12px;background:#eaf0df;border-radius:7px;color:#48634d;font-size:13px}.btn{border:0;background:var(--green);color:white;border-radius:13px;padding:13px 24px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:49px}.btn:hover{background:var(--deep);transform:translateY(-1px)}.btn.secondary{background:#fff;color:var(--green);border:1px solid var(--line)}.btn.light{background:var(--lime);color:var(--deep)}.btn.smallbtn{padding:8px 16px;min-height:40px;font-size:14px}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:23px}.art{background:#e4ead6;border-radius:25px;overflow:hidden;position:relative;border:1px solid #dbe3ce}.art svg{display:block;width:100%;height:auto}.art-label{position:absolute;left:22px;top:20px;border:1px solid #fff8;background:#fff9;border-radius:30px;padding:6px 15px;font-size:12px;letter-spacing:1px}.caption{padding:9px 17px;font-size:12px;color:#587060;background:#f3f5e9}.route-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.route-card{border:1px solid var(--line);background:#fff7;border-radius:16px;padding:20px}.route-card span{display:block;color:var(--green);font-size:12px;font-weight:bold;letter-spacing:1px}.route-card h3{font-size:17px;margin:8px 0 3px}.route-card p{font-size:13px;color:var(--muted)}footer{padding:18px 0 0;font-size:12px;color:#718073;display:flex;gap:14px;justify-content:space-between;margin-top:24px;border-top:1px solid var(--line)}.crumbs{display:flex;gap:5px;align-items:center;margin-bottom:28px;flex-wrap:wrap}.crumb{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:8px;font-size:14px}.crumb.active{background:var(--green);color:#fff}.crumb.done{background:#e7edda;color:var(--green)}.step-head{display:flex;align-items:flex-start;gap:20px;justify-content:space-between;margin-bottom:25px}.step-head p{color:var(--muted);margin-top:8px}.stamp{background:#f0ecd9;border:1px dashed #c7bc85;border-radius:12px;font-size:13px;padding:10px 16px;transform:rotate(3deg);white-space:nowrap}.layout{display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow)}.panel.soft{background:#edf2e6}.panel h3{margin-bottom:13px}.label{font-size:12px;letter-spacing:1px;font-weight:750;color:var(--muted);margin-bottom:13px}.guide{display:flex;gap:13px;align-items:flex-start;background:#edf2e6;padding:18px 22px;border-radius:16px;margin:0 0 22px}.avatar{flex:0 0 37px;height:37px;display:grid;place-items:center;background:var(--green);color:white;border-radius:50%;font-size:20px}.guide p{font-size:15px}.weather{background:#e9f1ed;border:1px solid #d6e5db;border-radius:18px;padding:22px}.weather-top{display:flex;align-items:center;justify-content:space-between}.weather strong{font-size:44px;line-height:1.2}.weather-icon{font-size:54px}.weather .meta{margin-top:18px;padding-top:14px;border-top:1px solid #c7dbce;font-size:14px}.inspect{border:1px solid #cadbb6;color:var(--green);background:#f4f7eb;border-radius:9px;padding:7px 12px;font-size:13px;margin-top:14px}.inspect:hover{background:#e3edcf}.inventory{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.item{border:2px solid #e4e8de;background:#fff;border-radius:13px;padding:13px 6px;display:flex;align-items:center;flex-direction:column;gap:3px;font-size:14px;position:relative}.item .emoji{font-size:29px}.item.selected{border-color:var(--green);background:#edf4e4}.item.selected:after{content:'✓';position:absolute;right:7px;top:3px;color:var(--green);font-weight:800}.choices{display:grid;gap:10px;margin-top:15px}.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;text-align:left;min-height:48px}.choice:hover{border-color:var(--green);background:#f5f7ed}.choice.picked{border:2px solid var(--green);background:#eef4e3}.dropbag{border:2px dashed #afc69d;background:#f1f6e7;border-radius:14px;padding:16px;text-align:center;margin:12px 0;color:#466a46;font-size:14px}.dropbag.over{border-color:var(--green);background:#dceba8}.feedback{border-radius:13px;padding:16px 19px;background:#fff1d9;color:#704613;margin-top:20px;white-space:pre-line}.feedback.success{background:#e8f1da;color:#285c3a}.feedback:empty{display:none}.successbox{margin-top:24px;padding:24px;border:1px solid #c6d9b2;border-radius:18px;background:#edf5e0}.successbox h3{color:var(--green);margin-bottom:6px}.successbox p{font-size:15px}.ticket{border:1px solid #d4dfd7;border-radius:18px;background:#fcfaf2;overflow:hidden}.ticket-head{padding:16px 22px;background:var(--green);color:white;display:flex;justify-content:space-between;font-size:14px}.ticket-body{padding:23px}.ticket-title{font-size:26px;font-weight:800;margin:9px 0 20px}.ticket-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-top:1px dashed #c1cabc;padding-top:18px}.ticket-grid b{display:block;font-size:26px}.ticket-grid span{font-size:13px;color:var(--muted)}.mystery{font-size:100px;text-align:center;line-height:1.6;font-weight:900;letter-spacing:9px;background:#faf2dd;border-radius:14px}.gates{display:flex;gap:12px;margin:20px 0}.gate{flex:1;padding:23px 8px;border:2px solid #d9e1d2;background:#f4f7ec;border-radius:15px;font-size:29px;font-weight:800}.gate span{display:block;font-size:12px;color:var(--muted);font-weight:500}.gate:hover{border-color:var(--green)}.mapbox{position:relative;border-radius:18px;overflow:hidden;background:#dfe9d0}.mapbox svg{width:100%;display:block}.spot{position:absolute;transform:translate(-50%,-50%);border:2px solid white;background:#fff;color:var(--green);box-shadow:0 4px 13px #32503928;border-radius:13px;padding:7px 11px;min-height:43px;font-size:14px;font-weight:700;white-space:nowrap}.spot:hover{background:var(--green);color:white}.spot.found{background:var(--lime);border-color:var(--green)}.quest-count{font-size:12px;letter-spacing:1px;color:var(--green);font-weight:bold;margin-bottom:10px}.quest{font-size:23px;font-weight:800;margin:15px 0}.progress-dots{display:flex;gap:7px;margin:16px 0}.progress-dots span{height:6px;background:#e4e8db;border-radius:5px;flex:1}.progress-dots span.on{background:var(--green)}.rule{background:#edf3e1;padding:18px;border-radius:14px;margin:15px 0}.lockers{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}.locker{padding:20px 4px 16px;border:2px solid #d2dec7;border-radius:9px;background:#edf2e3;font-weight:850;position:relative;font-size:19px;box-shadow:inset 0 8px #fff7}.locker:after{content:'';display:block;width:5px;height:14px;background:#98ac8c;border-radius:5px;margin:7px auto}.locker:hover{border-color:var(--green)}.locker.open{background:var(--lime);border-color:var(--green)}.fields{display:flex;gap:12px;margin-top:15px;flex-wrap:wrap}label{display:block;font-size:14px;font-weight:650}select,input,textarea{border:1px solid #cdd7c8;border-radius:9px;background:#fff;color:var(--ink);padding:11px;max-width:100%}textarea{width:100%;resize:vertical;min-height:100px;margin-top:8px}.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.data-card{border:1px solid var(--line);padding:14px;border-radius:13px;background:white;text-align:left}.data-card.selected{border:2px solid var(--green);background:#eff5e3}.data-card .datum{display:block;font-size:23px;font-weight:bold;margin:7px 0}.data-card .type{font-size:11px;letter-spacing:1px;color:var(--green)}.data-card .desc{font-size:12px;color:var(--muted)}.postcard{background:#fffdf5;border:1px solid #daceaa;border-radius:17px;overflow:hidden}.postcard-art{height:150px;overflow:hidden;background:#deead5}.postcard-art svg{width:100%;height:100%;object-fit:cover}.postcard-content{padding:24px}.postcard h3{font-size:25px;margin:4px 0 17px}.post-tags{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.post-tag{background:#eff1df;border-radius:8px;padding:6px 11px;font-size:14px}.post-message{font-size:16px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.post-mark{border-top:1px dashed #c5ccaf;margin-top:18px;padding-top:12px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.badges{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}.badge{border:1px dashed #a6b78e;background:#f1f5e5;padding:8px 13px;border-radius:40px;font-size:13px}.empty{padding:20px;color:var(--muted);font-size:15px;border:1px dashed var(--line);border-radius:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--deep);color:white;border-radius:12px;padding:12px 23px;box-shadow:var(--shadow);z-index:30;font-size:14px;max-width:90vw;text-align:center}.toast[hidden]{display:none}dialog{border:1px solid var(--line);border-radius:22px;padding:0;width:min(640px,92vw);max-height:86vh;color:var(--ink);box-shadow:0 24px 80px #162e3930;background:#fcfbf5}dialog::backdrop{background:#132d2666;backdrop-filter:blur(4px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:21px 24px;border-bottom:1px solid var(--line)}.dialog-body{padding:24px;overflow:auto}.dialog-body p{margin:10px 0}.dialog-body ol,.dialog-body ul{padding-left:22px}.close{border:0;border-radius:50%;width:36px;height:36px;background:#edf0e5;font-size:22px}.teacher-table{border-collapse:collapse;width:100%;font-size:14px}.teacher-table td,.teacher-table th{padding:10px;border-bottom:1px solid var(--line);text-align:left}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:12px}.note{background:#f3f1e4;padding:13px 17px;border-radius:12px;margin-top:15px;font-size:13px}.spark{display:inline-block;animation:pop .5s ease}.error-page{padding:30px}noscript{display:block;padding:40px}.only-print{display:none}@keyframes pop{0%{transform:scale(.3) rotate(-20deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:850px){.hero{grid-template-columns:1fr;gap:25px;padding-top:5px}.hero p{max-width:none}.hero .art{max-height:370px}.route-cards{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.bar{padding:12px 18px;flex-wrap:wrap}.brand{font-size:17px}.pill{padding:7px 11px;font-size:12px}.wrap{padding:23px 18px}.step-head{gap:10px}.stamp{display:none}.hero h1{letter-spacing:-1px}.hero .art svg{max-height:370px}.panel{padding:20px}.data-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.bar{gap:7px}.brand{width:100%;margin-bottom:3px}.bar .pill{flex:1}.route-cards{grid-template-columns:1fr 1fr}.route-card{padding:15px}.route-card:last-child{grid-column:1/-1}.crumbs{gap:3px}.crumb{font-size:12px;padding:7px 8px}.inventory{grid-template-columns:repeat(3,1fr)}.spot{font-size:11px;padding:5px 7px;min-height:35px}.weather strong{font-size:36px}.ticket-grid b{font-size:23px}.ticket-body{padding:17px}.data-card{padding:10px}.data-card .datum{font-size:18px}footer{display:block}.hero{padding-bottom:25px}.postcard-content{padding:18px}}
@media print{body{background:white}header,.crumbs,.step-head,.guide,.chooser,.actions,footer,.feedback,.successbox,.badges,.small,.note,dialog,.toast{display:none!important}.wrap{padding:0;max-width:none}.layout{display:block}.postcard{margin:15mm;border:1px solid #bbb;break-inside:avoid}.only-print{display:block}.panel{box-shadow:none}.postcard .post-mark{display:flex}.postcard .eyebrow{display:block}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand"><span class="mark" aria-hidden="true">✦</span>数据旅行家<span class="small muted"> / 莲花山</span></div><button class="pill" id="homeBtn">旅行地图</button><button class="pill" id="pocketBtn">旅行口袋 <span class="count" id="pocketCount">0</span></button><button class="pill" id="teacherBtn">教师指南</button></div></header>
<main class="wrap" id="app"></main>
<noscript>请使用启用了 JavaScript 的浏览器打开本文件，开始数据旅行。</noscript>
<dialog id="modal" aria-labelledby="modalTitle"><div class="dialog-head"><h3 id="modalTitle"></h3><button class="close" id="closeModal" aria-label="关闭对话框">×</button></div><div class="dialog-body" id="modalBody"></div></dialog>
<div class="toast" role="status" id="toast" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s), app=$('#app');
const KEY='lianhua-data-traveller-v1';
const initial=()=>({screen:0,unlocked:1,done:[],cards:[],bag:[],packReason:'',ticketOpen:false,mapStep:0,cabinet:false,selected:[],message:'',finished:false});
let state=initial(), storageOK=true;
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&Array.isArray(old.done)&&Array.isArray(old.cards)&&Number.isInteger(old.screen)){state={...initial(),...old};state.screen=Math.max(0,Math.min(5,state.screen));state.unlocked=Math.max(1,Math.min(5,Number(state.unlocked)||1));state.done=state.done.filter(n=>Number.isInteger(n)&&n>=1&&n<=4);state.mapStep=Math.max(0,Math.min(3,Number(state.mapStep)||0));for(const k of ['cards','bag','selected'])if(!Array.isArray(state[k]))state[k]=[];if(typeof state.message!=='string')state.message='';state.message=state.message.slice(0,90);}}catch(e){storageOK=false;}
let mapPicked=false,gatePicked=false,toastTimer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}$('#pocketCount').textContent=state.cards.length;}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3200);}
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').showModal();}
$('#closeModal').onclick=()=>$('#modal').close();$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').close();};
const cards={
 temperature:{type:'数字',value:'24～28 ℃',desc:'这次游戏中的气温范围',explain:'24和28是数字。和温度单位℃放在一起，才知道这组数据表示温度；℃本身是符号。'},
 rain:{type:'符号',value:'☂',desc:'下午有雨的天气线索',explain:'天气图中的雨伞、雨滴等符号能提示降雨。符号也能表示数据，本次天气是教学设定。'},
 park:{type:'汉字',value:'莲花山公园',desc:'这次旅行的目的地',explain:'地点名称用汉字告诉我们要去哪里。数据不只有数字。'},
 bus:{type:'字母＋数字',value:'LHS-01',desc:'虚构研学车的车次编码',explain:'字母、符号和数字可以组合成编码。LHS-01是这次游戏约定的车次，不是真实公交线路。'},
 gate:{type:'数字',value:'12号集合口',desc:'研学票上的集合位置',explain:'12在这张票上表示集合口编号，不是数量12个人，也不是12点。要结合字段读数据。'},
 kite:{type:'汉字',value:'风筝广场',desc:'根据名称找到的景点',explain:'地图上的汉字名称帮助我们辨认地点。风筝广场是莲花山公园的真实景点。'},
 toilet:{type:'符号',value:'🚻',desc:'地图中的卫生间符号',explain:'约定的图形符号能帮助我们快速找到设施。游戏位置是示意，不是实际导航。'},
 view:{type:'图片',value:'山顶风景画',desc:'用图片记录山丘与城市',explain:'图片可以表示数据：这幅示意画描绘山丘、树木和城市建筑。它不是实景照片。'},
 code:{type:'字母＋数字',value:'B03',desc:'本次游戏的风筝柜编号',explain:'本游戏约定A为左侧柜组、B为右侧柜组，两位数字表示柜号。所以B03是右侧柜组的03号柜。'}
};
state.cards=state.cards.filter(id=>cards[id]);state.selected=state.selected.filter(id=>state.cards.includes(id));
function collect(ids){let n=0;ids.forEach(id=>{if(!state.cards.includes(id)){state.cards.push(id);n++;}});save();if(n)toast('✦ 收集到 '+n+' 张数据卡，已放进旅行口袋');}
function inspect(id){collect([id]);const c=cards[id];modal('数据放大镜',`<div class="label">${c.type}</div><h2>${c.value}</h2><p>${c.explain}</p><div class="note">这张数据卡已收进口袋。你可以在旅程最后用它制作明信片。</div>`);}
const names=['出发准备','寻找研学车','公园寻宝','风筝柜编号','旅行明信片'];
function crumbs(){return `<nav class="crumbs" aria-label="关卡导航">${names.map((n,i)=>`<button class="crumb ${state.screen===i+1?'active':state.done.includes(i+1)?'done':''}" data-go="${i+1}" ${state.unlocked<i+1?'disabled':''}>${state.done.includes(i+1)?'✓':String(i+1).padStart(2,'0')} ${n}</button>`).join('')}</nav>`;}
function foot(){return `<footer><span>四年级 · 数据宝藏在身边 · 不计时，可以反复尝试</span><span>教学游戏｜天气、车票、设施位置与编号为模拟情境</span></footer>`;}
function heading(n,title,sub){return `<div class="step-head"><div><div class="eyebrow">LIANHUA FIELD TRIP / 第 ${n} 站</div><h2>${title}</h2><p>${sub}</p></div><div class="stamp">沿途发现 · 数据之美</div></div>`;}
function guide(text){return `<div class="guide"><span class="avatar" aria-hidden="true">芽</span><p><b>旅行搭档 · 小芽</b><br>${text}</p></div>`;}
function feedback(text,good=false){const el=$('#feedback');el.className='feedback'+(good?' success':'');el.textContent=text;}
function success(n,text){return `<div class="successbox" role="status"><h3><span class="spark">✦</span> 获得「${['','行李规划师','车票解读员','地图小侦探','编码小能手'][n]}」贴纸</h3><p>${text}</p><div class="actions"><button class="btn" data-go="${n+1}">${n===4?'制作我的明信片':'去下一站'} <span aria-hidden="true">→</span></button></div></div>`;}
function complete(n,ids){if(!state.done.includes(n))state.done.push(n);state.unlocked=Math.max(state.unlocked,n+1);collect(ids);save();render();}

t-family="sans-serif">山丘 · 风筝 · 城市 · 数据</text></svg>`;}
function home(){return `<section class="hero"><div><div class="eyebrow">一场带着好奇心的城市旅行</div><h1>去莲花山，<br>发现<span style="color:var(--green)">数据</span><br>藏在哪里。</h1><p>和小芽一起准备行李、读车票、逛公园。<br>把一路上的发现，变成自己的旅行明信片。</p><div class="tags"><span class="tag">4个探索关卡</span><span class="tag">约15～20分钟</span><span class="tag">适合两人合作</span></div><div class="actions"><button class="btn" id="startBtn">${state.done.length||state.ticketOpen?'继续我的旅行':'背上书包，出发'} <span aria-hidden="true">↗</span></button>${state.done.length||state.ticketOpen?'<button class="btn secondary" id="resetBtn">重新旅行</button>':''}</div><p class="small">无需登录 · 可离线游玩 · 进度${storageOK?'保存在本机浏览器':'仅在当前页面保留'}</p></div><div class="art"><span class="art-label">深圳 · 莲花山公园 / 教学情境</span>${sceneSVG()}<div class="caption">原创示意画，不是实景照片或导航地图</div></div></section><div class="route-cards">${names.map((n,i)=>`<div class="route-card"><span>${state.done.includes(i+1)?'✓ 已探索':'0'+(i+1)}</span><h3>${n}</h3><p>${['数据帮我作选择','读懂数字的含义','文字、符号与图片','按照约定读编码','用数据讲述旅行'][i]}</p></div>`).join('')}</div>${foot()}`;}
const gear=[['umbrella','☂','雨伞'],['water','💧','水壶'],['shoes','👟','运动鞋'],['hat','🧢','帽子'],['book','📖','图画书'],['coat','🧥','轻便外套']];
function pack(){const done=state.done.includes(1);return `${heading(1,'先读天气，再装背包','数据，会帮助我们作出怎样的选择？')}${guide('我们要在公园走走，下午才回来。我需要带饮水，也想避免被雨淋湿。请帮我挑选行李！')}<div class="layout"><section class="panel"><div class="label">目的地天气卡 · 游戏设定</div><div class="weather"><div class="weather-top"><div><h3>莲花山公园</h3><strong>24～28 <span style="font-size:22px">℃</span></strong></div><span class="weather-icon" aria-label="雨天符号">☂</span></div><div class="meta">上午多云 · 下午有雨<br>出行活动：步行游园，傍晚回家</div></div><button class="inspect" data-inspect="temperature">⌕ 用放大镜看看气温</button> <button class="inspect" data-inspect="rain">⌕ 看看天气符号</button><div class="note">先找线索：天气卡告诉了你什么？不是只看数字哦。</div></section><section class="panel"><h3>我的旅行背包</h3><p class="small muted">点击物品或拖到背包里，再点可取出。挑选3～4件，不同选择可以有不同理由。</p><div class="inventory">${gear.map(([id,icon,name])=>`<button class="item ${state.bag.includes(id)?'selected':''}" data-gear="${id}" draggable="${!done}" aria-pressed="${state.bag.includes(id)}" ${done?'disabled':''}><span class="emoji" aria-hidden="true">${icon}</span>${name}</button>`).join('')}</div><div class="dropbag" id="dropbag" role="region" aria-label="背包放置区">🎒 把物品拖到这里，装进旅行背包</div><p class="small" id="bagCount">已经装入 ${state.bag.length} 件物品</p><label for="packReason" style="margin-top:15px">哪条数据支持你带雨伞？</label><select id="packReason" style="width:100%;margin-top:8px" ${done?'disabled':''}><option value="">选择你的依据</option><option value="rain" ${state.packReason==='rain'?'selected':''}>天气卡上写着“下午有雨”，还有雨天符号</option><option value="temp" ${state.packReason==='temp'?'selected':''}>只因为看见了数字28</option><option value="name" ${state.packReason==='name'?'selected':''}>只因为目的地叫莲花山公园</option></select>${done?'':`<div class="actions"><button class="btn" id="checkPack">检查背包 →</button></div>`}<div class="feedback" id="feedback" role="status" aria-live="polite"></div></section></div>${done?success(1,'你用天气数据选择了雨伞，也按步行需要带了水。数据可以帮助我们作决定，其他物品可以有不同的合理理由。'):''}${foot()}`;}
function bus(){const done=state.done.includes(2);return `${heading(2,'一个“12”，能告诉我什么？','读懂研学票，找到正确的集合口。')}${guide(state.ticketOpen?'票上有好几个数字。请先找到它们旁边的文字，再决定去哪里集合。':'我捡起研学票，只看到了“12”。它是时间、座位，还是集合口？我们能直接断定吗？')}<div class="layout"><section class="panel">${state.ticketOpen?`<div class="ticket"><div class="ticket-head"><span>小芽研学 · 模拟乘车凭证</span><span>FIELD TRIP</span></div><div class="ticket-body"><div class="small muted">学校 → 公园</div><div class="ticket-title">莲花山公园</div><div class="small">车次编码 <b style="font-size:22px;margin-left:8px">LHS-01</b></div><div class="ticket-grid"><div><span>出发时间</span><b>09:00</b></div><div><span>集合口</span><b>12</b></div><div><span>座位号</span><b>08</b></div></div></div></div><button class="inspect" data-inspect="gate">⌕ 看看数字12</button> <button class="inspect" data-inspect="bus">⌕ 看看LHS-01</button>`:`<div class="label">票面暂时被遮住了</div><div class="mystery">12</div><p class="small muted" style="margin-top:16px">先想一想，再打开完整的票。</p>`}<div class="note">这是虚构研学车票，不是实际公交、地铁或公园门票。</div></section><section class="panel">${!state.ticketOpen?`<h3>只看到12，你能确定它的意思吗？</h3><div class="choices"><button class="choice" data-mystery="time">能，它一定是12点</button><button class="choice" data-mystery="seat">能，它一定是12号座位</button><button class="choice" data-mystery="context">还不能，要看看它旁边的文字</button></div>`:`<h3>我们应该去哪个集合口？</h3><div class="gates">${['08','09','12'].map(x=>`<button class="gate" data-gate="${x}" ${done?'disabled':''}><span>集合口</span>${x}</button>`).join('')}</div><div id="gateWhy">${done?'<p class="muted">已根据“集合口”字段找到12号集合口。</p>':'<p class="small muted">先点击集合口，再说明你的依据。</p>'}</div>`}<div class="feedback" id="feedback" role="status" aria-live="polite"></div></section></div>${done?success(2,'12在这张票上表示集合口编号。同样的数字，放在不同情境中，意思可能不同。'):''}${foot()}`;}
const quests=[{id:'kite',text:'小芽想去风筝广场看风筝。请在地图上找到它。',why:'刚才主要是哪种数据帮你找到它？',type:'汉字',hint:'看一看地图上写出的地点名称。'}, {id:'toilet',text:'走了一会儿，小芽想找卫生间。请根据地图标识帮忙。',why:'没有写出“卫生间”，你主要靠什么认出来？',type:'符号',hint:'观察蓝色设施标识，哪一个图形表达了卫生间？'}, {id:'summit',text:'小芽想去画着“高处望城市”的地方。请点击那幅小风景画。',why:'这次主要是哪种数据告诉你那里能看到什么？',type:'图片',hint:'寻找画着绿色山丘和城市楼房的小图片。'}];
function mapSVG(){return `<svg viewBox="0 0 620 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="游戏公园示意地图：山丘、湖水、草坪与小路；地点可用图上按钮选择"><rect width="620" height="470" fill="#e1ebd2"/><path d="M0 165Q140 29 300 116T620 73V0H0Z" fill="#c4d8b3"/><path d="M105 135Q263-27 407 154Q328 223 198 196Z" fill="#92b783"/><path d="M296 166Q266 230 341 265T365 353Q269 405 129 466" fill="none" stroke="#f6edd3" stroke-width="27"/><path d="M341 265Q456 226 531 311M329 369L155 316" fill="none" stroke="#f6edd3" stroke-width="20"/><ellipse cx="479" cy="212" rx="83" ry="46" fill="#93c4c4"/><path d="M429 207q40-12 85 0m-70 17q31-8 61 0" fill="none" stroke="#c7e6df" stroke-width="3"/><g fill="#5b9366"><circle cx="65" cy="195" r="28"/><circle cx="114" cy="210" r="21"/><circle cx="524" cy="400" r="28"/><circle cx="567" cy="365" r="24"/><circle cx="87" cy="388" r="24"/><circle cx="401" cy="76" r="24"/></g><path d="M190 257l17-22 17 22-17 24Z" fill="#e8a26d"/><path d="M207 281q-8 13 0 22" stroke="#ac7a52" fill="none"/><text x="22" y="440" fill="#627f60" font-size="13" font-family="sans-serif">示意地图 · 不用于实际导航</text></svg>`;}
function tinyView(){return `<svg width="84" height="42" viewBox="0 0 100 50" role="img" aria-label="高处望城市的风景画"><rect width="100" height="50" rx="5" fill="#d7e8e4"/><g fill="#91b0b2"><path d="M49 35V10h12v25m4 0V18h11v17m4 0V5h9v30"/></g><path d="M0 50L30 17 56 50Z" fill="#4f8957"/><path d="M24 50L59 28 86 50Z" fill="#95b97b"/></svg>`;}
function parkMap(){const done=state.done.includes(3),q=quests[Math.min(state.mapStep,2)];return `${heading(3,'打开地图，发现不同的数据','跟着三条线索，帮小芽找到想去的地方。')}${guide('你可以在地图上点击地点。名称、符号和风景画，都可能是重要线索！')}<div class="layout"><section class="panel"><div class="mapbox">${mapSVG()}<button class="spot" data-spot="summit" style="left:46%;top:28%" aria-label="高处望城市的风景画">${tinyView()}</button><button class="spot" data-spot="kite" style="left:29%;top:67%">风筝广场</button><button class="spot" data-spot="lake" style="left:78%;top:47%">莲花湖</button><button class="spot" data-spot="toilet" style="left:81%;top:76%;background:#e4f0f3;font-size:23px" aria-label="卫生间图形符号">🚻</button><button class="spot" data-spot="entrance" style="left:30%;top:91%">公园入口</button></div><div class="legend"><span>● 汉字地点名称</span><span>● 设施符号</span><span>● 风景示意画</span></div><button class="inspect" data-inspect="park">⌕ 看看公园名称</button><div class="note">风筝广场、莲花湖、山顶广场为真实景点；地图布局与设施位置为教学示意。</div></section><section class="panel"><div class="quest-count">${done?'三条线索已完成':'线索 '+(state.mapStep+1)+' / 3'}</div><div class="progress-dots">${quests.map((_,i)=>`<span class="${state.mapStep>i?'on':''}"></span>`).join('')}</div>${done?`<h3>地图里，不只有数字</h3><p>地点名称用汉字，设施标识用符号，风景画用图片。不同形式的数据都能帮助我们了解事物。</p><div class="actions"><button class="inspect" data-inspect="view">⌕ 放大镜：风景画</button></div>`:`<div class="quest">${q.text}</div><div id="mapWhy"><p class="small muted">在左侧地图上选择一个地点。</p></div>`}<div class="feedback" id="feedback" role="status" aria-live="polite"></div></section></div>${done?success(3,'你读懂了汉字、符号和图片。同一个地方还可以用名称、地图或图片来介绍。'):''}${foot()}`;}
function cabinets(){const done=state.done.includes(4);return `${heading(4,'风筝柜里的小秘密','读懂一个编码，再亲手编一个。')}${guide('我们来到游戏中的风筝借用点，拿到编号B03。先看看约定的规则，才能知道风筝在哪个柜子里。')}<div class="layout"><section class="panel"><div class="label">游戏约定 · 不代表公园实际设施</div><div class="rule"><b>A＝左侧柜组，B＝右侧柜组</b><br>后面两位数字＝柜号，如01、02、03、04</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">${['A','B'].map(g=>`<div><h3 style="font-size:17px">${g==='A'?'左侧':'右侧'} · ${g}组</h3><div class="lockers" style="grid-template-columns:repeat(2,1fr)">${['01','02','03','04'].map(n=>`<button class="locker ${state.cabinet&&g+n==='B03'?'open':''}" data-locker="${g+n}" ${state.cabinet?'disabled':''}>${g+n}</button>`).join('')}</div></div>`).join('')}</div><button class="inspect" data-inspect="code">⌕ 看看编码的规则</button></section><section class="panel">${!state.cabinet?`<div class="label">我的领取编号</div><div class="mystery" style="font-size:66px">B03</div><p style="margin-top:19px">点击正确的柜子，取出风筝。</p>`:`<div class="label">${done?'编码挑战完成':'风筝已经取出，再来试一次'}</div><h3>给“左侧柜组的02号柜”编个号</h3><p class="muted">按照同一条规则，组合字母和数字。</p><div class="fields"><label>柜组<br><select id="codeLetter" ${done?'disabled':''}><option value="">选择字母</option><option value="A" ${done?'selected':''}>A</option><option value="B">B</option></select></label><label>柜号<br><select id="codeNumber" ${done?'disabled':''}><option value="">选择数字</option><option>01</option><option ${done?'selected':''}>02</option><option>03</option><option>04</option></select></label></div>${done?'':`<div class="actions"><button class="btn" id="checkCode">检查我的编码 →</button></div>`}` }<div class="feedback" id="feedback" role="status" aria-live="polite"></div></section></div>${done?success(4,'B03表示右侧柜组的03号柜，A02表示左侧柜组的02号柜。编码按照规则表示数据；换个场景，规则也可能不同。'):''}${foot()}`;}
function postcardHTML(){return `<div class="postcard" id="postcard"><div class="postcard-art">${sceneSVG()}</div><div class="postcard-content"><div class="eyebrow" style="margin-bottom:6px">A LITTLE FIELD NOTE</div><h3>来自莲花山的明信片</h3><div class="post-tags">${state.selected.map(id=>`<span class="post-tag">${cards[id].type==='图片'?'▧ ':''}${cards[id].value}</span>`).join('')||'<span class="muted small">从旅行口袋中选择你的发现……</span>'}</div><p class="post-message" id="postMessage">${esc(state.message||'这里将出现你写给小伙伴的旅行发现。')}</p><div class="post-mark"><span>数据旅行家 · 莲花山公园</span><span>教学模拟旅行</span></div></div></div>`;}
function postcard(){return `${heading(5,'把发现，寄给小伙伴','选择数据，写下发现，留下一张属于你的明信片。')}${guide('挑选至少3张卡片，包含至少3种不同的表示形式，再写一句有数据依据的旅行发现。收集卡片多，不如介绍得清楚！')}<div class="layout"><section class="panel chooser"><h3>我的旅行口袋</h3><p class="small muted" style="margin-bottom:16px">至少包含数字、汉字、字母、符号、图片中的3种。最多选6张。</p><div class="data-grid">${state.cards.map(id=>`<button class="data-card ${state.selected.includes(id)?'selected':''}" data-select="${id}" aria-pressed="${state.selected.includes(id)}"><span class="type">${cards[id].type}</span><span class="datum">${cards[id].value}</span><span class="desc">${cards[id].desc}</span></button>`).join('')}</div><label for="message" style="margin-top:20px">我想告诉小伙伴……（最多90字）</label><textarea id="message" maxlength="90" placeholder="例如：这次模拟旅行中，天气卡提示下午有雨，所以我带了雨伞。">${esc(state.message)}</textarea><p class="small muted" id="charCount">${state.message.length} / 90字 · 不需要填写姓名或其他个人信息</p><div class="actions"><button class="btn" id="finishBtn">完成明信片 ✦</button></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div></section><section><div id="preview">${postcardHTML()}</div><div class="badges"><span class="badge">✓ 行李规划师</span><span class="badge">✓ 车票解读员</span><span class="badge">✓ 地图小侦探</span><span class="badge">✓ 编码小能手</span></div><div id="finishBox">${state.finished?finishHTML():''}</div></section></div>${foot()}`;}
function finishHTML(){return `<div class="successbox"><h3>✦ 你是数据旅行家了！</h3><p>请同伴读一读：你去了哪里？哪条数据支持你的发现？如果还不清楚，就补充或修改一句。</p><div class="actions"><button class="btn" id="downloadBtn">保存明信片图片 ↓</button><button class="btn secondary" id="printBtn">打印</button></div><div class="actions"><button class="btn secondary smallbtn" id="resetBtn">再来一次旅行</button></div></div>`;}
function render(){const screens=[home,pack,bus,parkMap,cabinets,postcard];app.innerHTML=(state.screen?crumbs():'')+screens[state.screen]();bind();save();}
function go(n){if(n>state.unlocked)return;state.screen=n;mapPicked=false;gatePicked=false;render();window.scrollTo({top:0,behavior:'auto'});const h=app.querySelector('h1,h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}}
function bind(){app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));app.querySelectorAll('[data-inspect]').forEach(b=>b.onclick=()=>inspect(b.dataset.inspect));
 if($('#startBtn'))$('#startBtn').onclick=()=>go(Math.min(state.unlocked,5));if($('#resetBtn'))$('#resetBtn').onclick=resetDialog;
 app.querySelectorAll('[data-gear]').forEach(b=>b.onclick=()=>{const id=b.dataset.gear;if(state.bag.includes(id))state.bag=state.bag.filter(x=>x!==id);else{if(state.bag.length>=4){feedback('背包最多装4件。先取出一件，再选择你更需要的物品。');return;}state.bag.push(id);}b.classList.toggle('selected',state.bag.includes(id));b.setAttribute('aria-pressed',state.bag.includes(id));$('#bagCount').textContent='已经装入 '+state.bag.length+' 件物品';save();});
 if($('#dropbag')&&!state.done.includes(1)){app.querySelectorAll('[data-gear]').forEach(b=>b.ondragstart=e=>e.dataTransfer.setData('text/plain',b.dataset.gear));const bag=$('#dropbag');bag.ondragover=e=>{e.preventDefault();bag.classList.add('over');};bag.ondragleave=()=>bag.classList.remove('over');bag.ondrop=e=>{e.preventDefault();bag.classList.remove('over');const id=e.dataTransfer.getData('text/plain');if(gear.some(g=>g[0]===id)&&!state.bag.includes(id))app.querySelector('[data-gear="'+id+'"]').click();};}
 if($('#packReason'))$('#packReason').onchange=e=>{state.packReason=e.target.value;save();};if($('#checkPack'))$('#checkPack').onclick=()=>{if(state.bag.length<3){feedback('还可以带些什么？请选择3～4件物品，再检查。');return;}if(!state.bag.includes('umbrella')){feedback('看看下午的天气。小芽不想被淋湿，哪件物品能帮忙？');return;}if(!state.bag.includes('water')){feedback('小芽说游园时需要饮水。再检查一下水壶有没有带上。');return;}if(state.packReason!=='rain'){feedback('24～28 ℃说明温度，公园名称说明地点。哪条数据直接告诉你可能需要避雨？');return;}complete(1,['temperature','rain','park']);};
 app.querySelectorAll('[data-mystery]').forEach(b=>b.onclick=()=>{if(b.dataset.mystery!=='context'){feedback('这是一个可能的猜测，但还不能确定。需要知道12旁边写了什么。');return;}state.ticketOpen=true;save();render();feedback('对！把数字放回完整的票面，意思就清楚多了。',true);});
 app.querySelectorAll('[data-gate]').forEach(b=>b.onclick=()=>{if(b.dataset.gate!=='12'){feedback(b.dataset.gate==='08'?'08写在“座位号”下面，它不是集合口。再找找“集合口”字段。':'09:00是出发时间。找集合地点时，需要看“集合口”字段。');return;}gatePicked=true;$('#gateWhy').innerHTML='<h3>为什么选择12号集合口？</h3><div class="choices"><button class="choice" data-gate-reason="size">因为12是票上最大的整数</button><button class="choice" data-gate-reason="field">因为“集合口”下面标着12</button></div>';feedback('位置选好了，再说说你的依据。',true);app.querySelectorAll('[data-gate-reason]').forEach(c=>c.onclick=()=>{if(c.dataset.gateReason!=='field'){feedback('编号的大小不能告诉你它的用途。看看数字旁边的文字。');return;}if(gatePicked)complete(2,['gate','bus']);});});
 app.querySelectorAll('[data-spot]').forEach(b=>b.onclick=()=>{if(state.done.includes(3)){const ids={summit:'view',kite:'kite',lake:'park',toilet:'toilet',entrance:'park'};inspect(ids[b.dataset.spot]);return;}const q=quests[state.mapStep];if(b.dataset.spot!==q.id){feedback(q.hint);return;}mapPicked=true;b.classList.add('found');$('#mapWhy').innerHTML=`<h3>${q.why}</h3><div class="choices">${['数字','汉字','符号','图片'].map(t=>`<button class="choice" data-map-type="${t}">${t}</button>`).join('')}</div>`;feedback('找到啦！再想想你用到了哪种形式的数据。',true);app.querySelectorAll('[data-map-type]').forEach(c=>c.onclick=()=>{if(c.dataset.mapType!==q.type){feedback(q.type==='图片'?'这幅画描绘了山丘和城市，它主要用画面来表达。':q.type==='汉字'?'你读到了“风筝广场”这几个字。想想它们是什么表示形式。':'这个图形没有写出设施名称，我们根据约定的图形含义认出了它。');return;}if(!mapPicked)return;collect([['kite','toilet','view'][state.mapStep]]);state.mapStep++;mapPicked=false;if(state.mapStep>=3)complete(3,[]);else{save();render();feedback('这条线索解开了！继续寻找下一个地点。',true);}});});
 app.querySelectorAll('[data-locker]').forEach(b=>b.onclick=()=>{if(b.dataset.locker!=='B03'){feedback(b.dataset.locker.startsWith('A')?'B表示右侧柜组。先找对柜组，再看数字。':'柜组找对了！03表示这个柜组里的03号柜，再看看柜号。');return;}state.cabinet=true;save();render();feedback('柜门打开了，风筝拿到了！轮到你来编一个号。',true);});
 if($('#checkCode'))$('#checkCode').onclick=()=>{if($('#codeLetter').value!=='A'||$('#codeNumber').value!=='02'){feedback('按规则再检查：左侧柜组用A，02号柜用两位数字02。');return;}complete(4,['code']);};
 app.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{const id=b.dataset.select;if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);else{if(state.selected.length>=6){feedback('明信片最多放6张数据卡。先取消一张，再选择。');return;}state.selected.push(id);}state.finished=false;b.classList.toggle('selected',state.selected.includes(id));b.setAttribute('aria-pressed',state.selected.includes(id));$('#preview').innerHTML=postcardHTML();$('#finishBox').innerHTML='';save();});
 if($('#message'))$('#message').oninput=e=>{state.message=e.target.value.slice(0,90);state.finished=false;$('#postMessage').textContent=state.message||'这里将出现你写给小伙伴的旅行发现。';$('#charCount').textContent=state.message.length+' / 90字 · 不需要填写姓名或其他个人信息';$('#finishBox').innerHTML='';save();};
 if($('#finishBtn'))$('#finishBtn').onclick=()=>{if(state.selected.length<3){feedback('再选几条你想分享的数据，至少需要3张卡片。');return;}const types=new Set(state.selected.flatMap(id=>cards[id].type.split('＋')));if(types.size<3){feedback('这些卡片的表示形式还不够丰富。试着加入图片、符号或不同形式的数据，使它们至少有3种。');return;}if(state.message.trim().length<6){feedback('再写一句完整的旅行发现吧：哪条数据让你知道了什么，或帮助你作出了什么选择？');$('#message').focus();return;}state.finished=true;save();$('#finishBox').innerHTML=finishHTML();bindExport();feedback('数据形式很丰富！现在请同伴检查：这句话有没有用到你选的数据，意思是否清楚。',true);$('#finishBox').scrollIntoView({behavior:'smooth',block:'nearest'});};bindExport();
}
function bindExport(){if($('#downloadBtn'))$('#downloadBtn').onclick=download;if($('#printBtn'))$('#printBtn').onclick=()=>window.print();if($('#resetBtn'))$('#resetBtn').onclick=resetDialog;}
function resetDialog(){modal('开始一次新的旅行？','<p>这会清除本机这次游戏的关卡进度、数据口袋和明信片文字。保存过的图片不受影响。</p><div class="actions"><button class="btn" id="confirmReset">重新出发</button><button class="btn secondary" id="cancelReset">保留这次旅行</button></div>');$('#cancelReset').onclick=()=>$('#modal').close();$('#confirmReset').onclick=()=>{state=initial();save();$('#modal').close();go(1);};}
$('#homeBtn').onclick=()=>go(0);$('#pocketBtn').onclick=()=>{modal('我的旅行口袋 · '+state.cards.length+' 张数据卡',state.cards.length?`<p class="small muted">点开任意一张卡片，再看一眼它的含义。</p><div class="data-grid">${state.cards.map(id=>`<button class="data-card" data-pocket="${id}"><span class="type">${cards[id].type}</span><span class="datum">${cards[id].value}</span><span class="desc">${cards[id].desc}</span></button>`).join('')}</div>`:'<div class="empty">口袋还是空的。点击场景里的“⌕ 放大镜”，或完成关卡，就能收集数据卡。</div>');$('#modalBody').querySelectorAll('[data-pocket]').forEach(b=>b.onclick=()=>{const c=cards[b.dataset.pocket];$('#modalTitle').textContent=c.value;$('#modalBody').innerHTML=`<span class="tag">${c.type}</span><p>${c.explain}</p>`;});};
$('#teacherBtn').onclick=()=>modal('教师指南 · 数据宝藏在身边',`<p>建议四年级学生两人一组，轮流担任“操作员”和“线索解说员”。约15～20分钟，无倒计时、无排行榜；答错后根据提示重试。</p><table class="teacher-table"><tr><th>环节</th><th>学习重点</th><th>建议</th></tr><tr><td>出发准备</td><td>用数据支持选择</td><td>3分钟</td></tr><tr><td>寻找研学车</td><td>结合情境理解数字；组合表示</td><td>3分钟</td></tr><tr><td>公园寻宝</td><td>汉字、符号、图片表示数据</td><td>4分钟</td></tr><tr><td>风筝柜编号</td><td>读懂和使用约定的编码</td><td>3分钟</td></tr><tr><td>旅行明信片</td><td>用多种形式的数据描述事物</td><td>4～7分钟</td></tr></table><h3 style="margin-top:20px">讨论比“通关”更重要</h3><ul><li>你根据哪条数据作出了选择？</li><li>同一个12，在别的地方还可能表示什么？</li><li>一张卡片可能包含多种表示形式，例：数字与单位。</li><li>游戏只检查明信片卡片数量、表示形式和最低文字长度；请同伴或教师评价句子是否与数据相符、表达是否清楚。</li></ul><h3>使用方式</h3><p>用Edge或Chrome直接打开本HTML即可离线游玩。无需账户，没有网络请求，不收集学生信息。进度在当前浏览器本机保存；换电脑或换浏览器不会同步。浏览器禁用本地存储时，页面保持打开即可继续。</p><p>关卡解锁后可以从顶部回看。明信片可保存为PNG或打印；再次编辑后需重新点击“完成明信片”。</p><h3>情境与来源</h3><p>依据《义务教育信息科技教学指南》四年级《数据与编码》第1课“数据宝藏在身边”（教材第10—12页）改编。旅行活动是原创教学设计。</p><p>公园名称、风筝广场、莲花湖、山顶广场参考<a href="https://www.sz.gov.cn/cn/xxgk/zfxxgj/bmdt/content/post_11525754.html" target="_blank" rel="noopener noreferrer">深圳政府在线：莲花山公园观光线介绍</a>。除此之外，天气、研学票、柜子、编号规则、地图布局与设施位置均为模拟，不是现实游园或交通指引。风景插图为原创示意。</p>`);
async function download(){const button=$('#downloadBtn');button.disabled=true;button.textContent='正在绘制图片…';try{const canvas=document.createElement('canvas');canvas.width=1200;const c=canvas.getContext('2d');c.font='27px "Microsoft YaHei", sans-serif';const lines=[];let current='';for(const ch of state.message.trim()){if(ch==='\n'||c.measureText(current+ch).width>1060){lines.push(current);current=ch==='\n'?'':ch;}else current+=ch;}if(current)lines.push(current);canvas.height=Math.max(1000,760+lines.length*44);c.fillStyle='#faf8ef';c.fillRect(0,0,1200,canvas.height);const svg=sceneSVG();const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob);const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url;});c.save();c.beginPath();c.rect(0,0,1200,330);c.clip();c.fillStyle='#e2ecda';c.fillRect(0,0,1200,330);c.drawImage(img,345,-14,510,353);c.restore();URL.revokeObjectURL(url);c.fillStyle='#23654e';c.font='bold 20px "Microsoft YaHei", sans-serif';c.fillText('A LITTLE FIELD NOTE  /  数据旅行家',65,380);c.fillStyle='#203e37';c.font='bold 48px "Microsoft YaHei", sans-serif';c.fillText('来自莲花山的明信片',65,450);let x=65,y=505;c.font='23px "Microsoft YaHei", sans-serif';state.selected.forEach(id=>{const v=cards[id].value,w=c.measureText(v).width+34;if(x+w>1135){x=65;y+=58;}c.fillStyle='#e8efda';c.fillRect(x,y,w,43);c.fillStyle='#32523d';c.fillText(v,x+17,y+29);x+=w+13;});y+=100;c.fillStyle='#29483a';c.font='27px "Microsoft YaHei", sans-serif';for(const line of lines){c.fillText(line,65,y);y+=44;}c.strokeStyle='#cbd4bb';c.beginPath();c.moveTo(65,canvas.height-80);c.lineTo(1135,canvas.height-80);c.stroke();c.font='18px "Microsoft YaHei", sans-serif';c.fillStyle='#68795f';c.fillText('莲花山公园 · 模拟旅行记录',65,canvas.height-42);c.fillText('用数据，讲述我的发现。',866,canvas.height-42);const out=await new Promise(r=>canvas.toBlob(r,'image/png'));if(!out)throw Error('图片生成失败');const link=document.createElement('a');const outURL=URL.createObjectURL(out);link.href=outURL;link.download='莲花山公园_我的数据明信片.png';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(outURL),10000);toast('明信片图片已生成，请查看浏览器下载。');}catch(e){toast('图片暂时没能保存，可以使用旁边的“打印”。');}finally{button.disabled=false;button.textContent='保存明信片图片 ↓';}}
render();
</script>
